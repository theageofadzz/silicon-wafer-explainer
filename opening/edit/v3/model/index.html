<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Silicon precise model layer</title>
  <style>
    @font-face{font-family:ModelNumbers;src:url("./assets/fonts/NotoSansSC-Regular.otf") format("opentype");font-weight:400;font-display:block}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    #model-v3{width:100%;height:100%;position:relative;overflow:hidden}
    .clip{position:absolute;inset:0;width:100%;height:100%}
    #model-canvas{display:block;width:100%;height:100%}
    #model-annotations{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #model-annotations path{fill:none;stroke:#b5dfdf;stroke-width:3;vector-effect:non-scaling-stroke}
    #model-dimension{font-family:ModelNumbers,sans-serif;font-size:42px;font-weight:400;fill:#f0f7f6;paint-order:stroke;stroke:#10171d;stroke-width:5;stroke-linejoin:round;letter-spacing:0}
    #model-site-callout path{stroke:#f2b34d;stroke-width:2.5}
    #model-site-label{font-family:ModelNumbers,sans-serif;font-size:40px;font-weight:400;fill:#fff1d4;letter-spacing:0}
  </style>
</head>
<body>
  <div id="model-v3" data-composition-id="silicon-model-v3" data-start="0" data-duration="30.375" data-width="1080" data-height="1920">
    <div id="model-render-layer" class="clip" data-start="0" data-duration="30.375" data-track-index="0">
      <canvas id="model-canvas" width="1080" height="1920"></canvas>
      <svg id="model-annotations" viewBox="0 0 1080 1920" aria-hidden="true">
        <path id="model-dimension-lines"></path>
        <text id="model-dimension" text-anchor="middle"></text>
        <g id="model-site-callout" opacity="0">
          <path id="model-site-leader"></path>
          <rect id="model-site-label-background" width="188" height="64" rx="4" fill="#10171d" fill-opacity=".94"></rect>
          <text id="model-site-label">示意杂质</text>
        </g>
      </svg>
    </div>
  </div>
  <script type="module" src="./model.mjs"></script>
</body>
</html>
